<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Lantern AR Experience</title>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #000; font-family: sans-serif;
    }
    #app-container { position: relative; width: 100vw; height: 100vh; }
    video {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1); z-index: 1;
    }
    canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 2;
    }
    #start-btn {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 99999; padding: 20px 40px; font-size: 22px; font-weight: bold;
      color: #fff; background: #004d00; border: 3px solid #00ff00; border-radius: 50px;
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.8); cursor: pointer; text-transform: uppercase;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="app-container">
    <button id="start-btn">🟢 IN BRIGHTEST DAY... (START) 🟢</button>
    <video id="webcam" playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <audio id="bg-music" src="Hero.mp3" loop></audio>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const ctx = canvasElement.getContext('2d');
    const startBtn = document.getElementById('start-btn');
    const bgMusic = document.getElementById('bg-music');

    const imgMask = new Image(); imgMask.src = 'green lantern mask2.png';
    const imgRing = new Image(); imgRing.src = 'landtern ring.png';
    const imgMogo = new Image(); imgMogo.src = 'mogo.png';
    const imgChp = new Image();  imgChp.src = "Ch'p-Photoroom.png";

    let faceData = null;
    let handData = null;

    function resizeCanvas() {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const faceMesh = new FaceMesh({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true });
    faceMesh.onResults(r => { faceData = r.multiFaceLandmarks?.[0] || null; });

    const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    hands.onResults(r => { handData = r.multiHandLandmarks?.[0] || null; });

    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none';
      bgMusic.play().catch(e => console.log(e));

      const cameraUtils = new Camera(videoElement, {
        onFrame: async () => {
          await faceMesh.send({ image: videoElement });
          await hands.send({ image: videoElement });
        },
        width: 1280, height: 720
      });
      cameraUtils.start();
      requestAnimationFrame(renderLoop);
    });

    function renderLoop() {
      const w = canvasElement.width;
      const h = canvasElement.height;

      ctx.clearRect(0, 0, w, h);

      // 1. วาด Mogo (ดาวเคราะห์) ไว้มุมซ้ายบนชัดเจน ไม่ให้ทับหัว
      if (imgMogo.complete) {
        const mogoSize = Math.min(w, h) * 0.32;
        ctx.drawImage(imgMogo, w * 0.05, h * 0.05, mogoSize, mogoSize);
      }

      // 2. วาด Ch'p (กระรอก) ไว้มุมขวาบน
      if (imgChp.complete) {
        const chpWidth = Math.min(w, h) * 0.25;
        const chpHeight = chpWidth * (imgChp.height / imgChp.width || 1.2);
        ctx.drawImage(imgChp, w - chpWidth - (w * 0.05), h * 0.03, chpWidth, chpHeight);
      }

      // 3. วาด หน้ากาก Green Lantern บนใบหน้า
      if (faceData && imgMask.complete) {
        const leftEye = faceData[33], rightEye = faceData[263], noseBridge = faceData[168];
        const noseX = (1 - noseBridge.x) * w, noseY = noseBridge.y * h;
        const lx = (1 - leftEye.x) * w, ly = leftEye.y * h;
        const rx = (1 - rightEye.x) * w, ry = rightEye.y * h;

        const eyeDist = Math.hypot(rx - lx, ry - ly);
        const maskWidth = eyeDist * 3.2;
        const maskHeight = maskWidth * (imgMask.height / imgMask.width || 0.5);
        const angle = Math.atan2(ry - ly, rx - lx);

        ctx.save();
        ctx.translate(noseX, noseY);
        ctx.rotate(angle);
        ctx.drawImage(imgMask, -maskWidth / 2, -maskHeight / 2.1, maskWidth, maskHeight);
        ctx.restore();
      }

      // 4. วาด แหวน Green Lantern ที่นิ้วกลาง (ปรับสัดส่วนรูปและพิกัดให้เป๊ะ)
      if (handData && imgRing.complete) {
        // ใช้จุดข้อต่อกลางนิ้วกลาง (Landmark 10 หรือ 11) เพื่อให้สวมลงบนนิ้วพอดี
        const ringJoint = handData[10]; 
        const ringX = (1 - ringJoint.x) * w;
        const ringY = ringJoint.y * h;

        const wrist = handData[0];
        const handSize = Math.hypot((1 - wrist.x) * w - ringX, wrist.y * h - ringY);
        
        // คำนวณสัดส่วนรูปแหวนไม่ให้เบี้ยว
        const ringWidth = Math.max(35, handSize * 0.35);
        const ringHeight = ringWidth * (imgRing.height / imgRing.width || 1.0);

        // คำนวณองศานิ้ว
        const mcp = handData[9], tip = handData[12];
        const fingerAngle = Math.atan2((tip.y - mcp.y) * h, ((1 - tip.x) - (1 - mcp.x)) * w);

        ctx.save();
        ctx.translate(ringX, ringY);
        ctx.rotate(fingerAngle - Math.PI / 2);
        ctx.drawImage(imgRing, -ringWidth / 2, -ringHeight / 2, ringWidth, ringHeight);
        ctx.restore();
      }

      requestAnimationFrame(renderLoop);
    }
  </script>
</body>
</html>
