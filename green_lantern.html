<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Lantern AR Experience</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #start-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      padding: 20px 40px;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      background: #006600;
      border: 3px solid #00ff00;
      border-radius: 50px;
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.8);
      cursor: pointer;
      text-transform: uppercase;
      transition: 0.3s;
    }
    #start-btn:hover {
      background: #008000;
      box-shadow: 0 0 40px #00ff00;
      transform: translate(-50%, -50%) scale(1.05);
    }
  </style>

  <!-- Three.js & MediaPipe -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="container">
    <button id="start-btn">🟢 BECOME GREEN LANTERN 🟢</button>
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <audio id="bg-music" src="Hero.mp3" loop></audio>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const startBtn = document.getElementById('start-btn');
    const bgMusic = document.getElementById('bg-music');

    // 1. Three.js Scene Setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ canvas: canvasElement, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
    scene.add(ambientLight);

    // 2. Load Textures & Sprites
    const textureLoader = new THREE.TextureLoader();
    let maskMesh = null;
    let chpMesh = null;
    let ringGlowMesh = null;

    // หน้ากาก Green Lantern
    textureLoader.load('green lantern mask2.png', (texture) => {
      const geometry = new THREE.PlaneGeometry(1.4, 0.7);
      const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
      maskMesh = new THREE.Mesh(geometry, material);
      maskMesh.visible = false;
      scene.add(maskMesh);
    });

    // ตัวละคร Ch'p
    textureLoader.load("Ch'p-Photoroom.png", (texture) => {
      const geometry = new THREE.PlaneGeometry(0.8, 1.2);
      const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
      chpMesh = new THREE.Mesh(geometry, material);
      chpMesh.position.set(1.6, 1.2, 0); // วางไว้ด้านขวาบนลอยข้างหัว
      scene.add(chpMesh);
    });

    // แหวนเขียวตามมือ
    const ringGeo = new THREE.RingGeometry(0.08, 0.16, 32);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
    ringGlowMesh = new THREE.Mesh(ringGeo, ringMat);
    ringGlowMesh.visible = false;
    scene.add(ringGlowMesh);

    // 3. MediaPipe Trackers
    let faceLandmarksData = null;
    let handLandmarksData = null;

    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true });
    faceMesh.onResults(results => {
      faceLandmarksData = (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) ? results.multiFaceLandmarks[0] : null;
    });

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    hands.onResults(results => {
      handLandmarksData = (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) ? results.multiHandLandmarks[0] : null;
    });

    // 4. Start Button Action
    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none';
      bgMusic.play().catch(e => console.log("Audio play error:", e));

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: false });
        videoElement.srcObject = stream;
        await videoElement.play();

        const sendToMediaPipe = async () => {
          if (!videoElement.paused && !videoElement.ended) {
            await faceMesh.send({ image: videoElement });
            await hands.send({ image: videoElement });
          }
          requestAnimationFrame(sendToMediaPipe);
        };
        sendToMediaPipe();

        animate();
      } catch (err) {
        console.error("Camera access error:", err);
      }
    });

    function toWorldCoords(x, y, zDepth = 0) {
      const vec = new THREE.Vector3((1 - x) * 2 - 1, -(y * 2 - 1), 0.5);
      vec.unproject(camera);
      const dir = vec.sub(camera.position).normalize();
      const distance = (zDepth - camera.position.z) / dir.z;
      return camera.position.clone().add(dir.multiplyScalar(distance));
    }

    // 5. Render Loop
    function animate() {
      requestAnimationFrame(animate);

      // --- หน้ากาก Green Lantern ---
      if (faceLandmarksData && maskMesh) {
        maskMesh.visible = true;
        const noseBridge = faceLandmarksData[6];
        const pos = toWorldCoords(noseBridge.x, noseBridge.y, 0);
        maskMesh.position.set(pos.x, pos.y + 0.03, pos.z);

        const leftEye = faceLandmarksData[33];
        const rightEye = faceLandmarksData[263];
        const angle = Math.atan2(rightEye.y - leftEye.y, rightEye.x - leftEye.x);
        maskMesh.rotation.z = -angle;
      } else if (maskMesh) {
        maskMesh.visible = false;
      }

      // --- แหวนวงแหวนพลังเขียวบนนิ้ว ---
      if (handLandmarksData && ringGlowMesh) {
        ringGlowMesh.visible = true;
        const ringFinger = handLandmarksData[14]; // โคนนิ้วนาง
        const pos = toWorldCoords(ringFinger.x, ringFinger.y, 0);
        ringGlowMesh.position.set(pos.x, pos.y, pos.z);
      } else if (ringGlowMesh) {
        ringGlowMesh.visible = false;
      }

      // อนิเมชันตัวละคร Ch'p ขยับลอยขึ้นลงเล็กน้อย
      if (chpMesh) {
        chpMesh.position.y = 1.2 + Math.sin(Date.now() * 0.003) * 0.1;
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
