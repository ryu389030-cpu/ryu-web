<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Lantern AR Experience</title>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #000; font-family: sans-serif;
    }
    #app-container { position: relative; width: 100vw; height: 100vh; }
    
    /* กล้องและ Canvas ปรับขนาดเต็มจอพอดี */
    video {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1); z-index: 1;
    }
    canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 2;
    }

    #start-btn {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 99999; padding: 20px 40px; font-size: 22px; font-weight: bold;
      color: #fff; background: #004d00; border: 3px solid #00ff00; border-radius: 50px;
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.8); cursor: pointer; text-transform: uppercase;
    }
  </style>

  <!-- MediaPipe Trackers -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="app-container">
    <button id="start-btn">🟢 IN BRIGHTEST DAY... (START) 🟢</button>
    <video id="webcam" playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <!-- เพลงประกอบตามชื่อไฟล์ที่ส่งมา -->
  <audio id="bg-music" src="Hero.mp3" loop></audio>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const ctx = canvasElement.getContext('2d');
    const startBtn = document.getElementById('start-btn');
    const bgMusic = document.getElementById('bg-music');

    // โหลดไฟล์รูปภาพตามชื่อไฟล์เป๊ะๆ
    const imgMask = new Image(); imgMask.src = 'green lantern mask2.png';
    const imgRing = new Image(); imgRing.src = 'landtern ring.png';
    const imgMogo = new Image(); imgMogo.src = 'mogo.png';
    const imgChp = new Image();  imgChp.src = "Ch'p-Photoroom.png";

    let faceData = null;
    let handData = null;

    function resizeCanvas() {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Setup MediaPipe
    const faceMesh = new FaceMesh({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true });
    faceMesh.onResults(r => { faceData = r.multiFaceLandmarks?.[0] || null; });

    const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    hands.onResults(r => { handData = r.multiHandLandmarks?.[0] || null; });

    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none';
      bgMusic.play().catch(e => console.log("Audio play error:", e));

      const cameraUtils = new Camera(videoElement, {
        onFrame: async () => {
          await faceMesh.send({ image: videoElement });
          await hands.send({ image: videoElement });
        },
        width: 1280,
        height: 720
      });
      cameraUtils.start();
      requestAnimationFrame(renderLoop);
    });

    function renderLoop() {
      const w = canvasElement.width;
      const h = canvasElement.height;

      // ล้างคราบเฟรมเก่า
      ctx.clearRect(0, 0, w, h);

      // 1. วาด Mogo (ดาวเคราะห์) ฝั่งซ้ายบน
      if (imgMogo.complete) {
        const mogoSize = Math.min(w, h) * 0.35;
        ctx.drawImage(imgMogo, w * 0.03, h * 0.08, mogoSize, mogoSize);
      }

      // 2. วาด Ch'p (กระรอก) ฝั่งขวาบน
      if (imgChp.complete) {
        const chpWidth = Math.min(w, h) * 0.28;
        const chpHeight = chpWidth * (imgChp.height / imgChp.width || 1.2);
        ctx.drawImage(imgChp, w - chpWidth - (w * 0.03), h * 0.05, chpWidth, chpHeight);
      }

      // 3. วาด หน้ากาก Green Lantern บนใบหน้า
      if (faceData && imgMask.complete) {
        // ตาซ้าย (33), ตาขวา (263), สันจมูกระหว่างตา (168)
        const leftEye = faceData[33];
        const rightEye = faceData[263];
        const noseBridge = faceData[168];

        // แปลงพิกัด MediaPipe เป็นพิกเซลจอ (สลับแกน X เพราะวีดีโอกระจกเงา)
        const noseX = (1 - noseBridge.x) * w;
        const noseY = noseBridge.y * h;

        const lx = (1 - leftEye.x) * w, ly = leftEye.y * h;
        const rx = (1 - rightEye.x) * w, ry = rightEye.y * h;

        // คำนวณระยะห่างระหว่างตาเพื่อปรับขนาดหน้ากากให้อัตโนมัติ
        const eyeDist = Math.hypot(rx - lx, ry - ly);
        const maskWidth = eyeDist * 3.2; // ปรับความกว้างหน้ากากให้พอดีตา
        const maskHeight = maskWidth * (imgMask.height / imgMask.width || 0.5);

        // มุมเอียงตามหัว
        const angle = Math.atan2(ry - ly, rx - lx);

        ctx.save();
        ctx.translate(noseX, noseY);
        ctx.rotate(angle);
        ctx.drawImage(imgMask, -maskWidth / 2, -maskHeight / 2.1, maskWidth, maskHeight);
        ctx.restore();
      }

      // 4. วาด แหวน Green Lantern ที่นิ้วกลาง
      if (handData && imgRing.complete) {
        // โคนนิ้วกลาง (Landmark 9) หรือ ข้อกลางนิ้วกลาง (Landmark 10)
        const middleFinger = handData[9];
        const ringX = (1 - middleFinger.x) * w;
        const ringY = middleFinger.y * h;

        // คำนวณขนาดแหวนจากระยะระหว่างโคนมือถึงนิ้ว
        const wrist = handData[0];
        const handSize = Math.hypot((1 - wrist.x) * w - ringX, wrist.y * h - ringY);
        const ringSize = Math.max(30, handSize * 0.28);

        ctx.save();
        ctx.translate(ringX, ringY);
        ctx.drawImage(imgRing, -ringSize / 2, -ringSize / 2, ringSize, ringSize);
        ctx.restore();
      }

      requestAnimationFrame(renderLoop);
    }
  </script>
</body>
</html>
