<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Lantern AR Experience</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0; padding: 0; background: #000; overflow: hidden; font-family: sans-serif;
    }
    #container {
      position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center;
    }
    video { display: none; }
    canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #start-btn {
      position: absolute; z-index: 10; padding: 18px 36px; font-size: 22px; font-weight: bold;
      color: #fff; background: #00ff66; border: none; border-radius: 50px;
      box-shadow: 0 0 25px #00ff66; cursor: pointer; text-transform: uppercase; transition: 0.3s;
    }
    #start-btn:hover { background: #00cc52; box-shadow: 0 0 35px #00ff66; transform: scale(1.05); }

    /* 🎛️ แผงควบคุม Live Tuner พร้อมปุ่มพับเก็บ (- / +) */
    #ui-panel {
      position: absolute; top: 10px; left: 10px; z-index: 99999;
      background: rgba(0, 20, 0, 0.9); color: #00ff66; padding: 12px;
      border-radius: 10px; border: 2px solid #00ff66; font-size: 11px;
      width: 270px; max-height: 95vh; overflow-y: auto; backdrop-filter: blur(5px);
      transition: all 0.3s ease;
    }
    #ui-panel.minimized {
      width: 45px; height: 45px; overflow: hidden; padding: 5px; border-radius: 50%;
    }
    #ui-panel.minimized .content-box { display: none; }
    
    .panel-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px solid #005500; padding-bottom: 4px;
    }
    .panel-header h3 { margin: 0; font-size: 13px; color: #fff; }
    #toggle-btn {
      background: #00ff66; color: #000; border: none; font-weight: bold; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; text-align: center; line-height: 24px; font-size: 14px;
    }

    .control-group { margin-bottom: 8px; border-bottom: 1px solid #005500; padding-bottom: 6px; }
    .control-group h4 { margin: 2px 0; color: #fff; font-size: 11px; }
    .control-row { display: flex; align-items: center; justify-content: space-between; margin: 3px 0; }
    .control-row label { width: 70px; }
    .control-row input[type="range"] { flex: 1; margin: 0 5px; }
    .control-row input[type="number"] { width: 45px; background: #111; color: #00ff66; border: 1px solid #00ff66; text-align: center; font-size: 10px; border-radius: 3px; }
  </style>
</head>
<body>

  <div id="container">
    <button id="start-btn">⚡ BECOME GREEN LANTERN ⚡</button>

    <div id="ui-panel">
      <div class="panel-header">
        <h3 id="panel-title">🟢 Tuner</h3>
        <button id="toggle-btn">-</button>
      </div>
      <div class="content-box">
        <div class="control-group">
          <h4>🎭 หน้ากาก (Mask)</h4>
          <div class="control-row"><label>Scale:</label><input type="range" id="maskScaleR" min="1.0" max="5.0" step="0.1" value="3.0"><input type="number" id="maskScaleN" step="0.1" value="3.0"></div>
        </div>

        <div class="control-group">
          <h4>🪐 Mogo (ดาวเคราะห์)</h4>
          <div class="control-row"><label>Scale:</label><input type="range" id="mogoScaleR" min="0.05" max="0.4" step="0.01" value="0.15"><input type="number" id="mogoScaleN" step="0.01" value="0.15"></div>
          <div class="control-row"><label>Pos X:</label><input type="range" id="mogoXOffsetR" min="-300" max="300" step="5" value="0"><input type="number" id="mogoXOffsetN" step="5" value="0"></div>
          <div class="control-row"><label>Pos Y:</label><input type="range" id="mogoYOffsetR" min="-300" max="300" step="5" value="0"><input type="number" id="mogoYOffsetN" step="5" value="0"></div>
        </div>

        <div class="control-group">
          <h4>🐿️ Ch'p (กระรอก)</h4>
          <div class="control-row"><label>Scale:</label><input type="range" id="chpScaleR" min="0.05" max="0.4" step="0.01" value="0.12"><input type="number" id="chpScaleN" step="0.01" value="0.12"></div>
          <div class="control-row"><label>Pos X:</label><input type="range" id="chpXOffsetR" min="-300" max="300" step="5" value="0"><input type="number" id="chpXOffsetN" step="5" value="0"></div>
          <div class="control-row"><label>Pos Y:</label><input type="range" id="chpYOffsetR" min="-300" max="300" step="5" value="0"><input type="number" id="chpYOffsetN" step="5" value="0"></div>
        </div>
      </div>
    </div>

    <video id="webcam" playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <audio id="bg-music" src="Hero.mp3" loop></audio>

  <script>
    // ปุ่มเปิด-ปิดพับหน้าต่าง UI
    const uiPanel = document.getElementById('ui-panel');
    const toggleBtn = document.getElementById('toggle-btn');
    const panelTitle = document.getElementById('panel-title');
    let isMinimized = false;

    toggleBtn.addEventListener('click', () => {
      isMinimized = !isMinimized;
      if (isMinimized) {
        uiPanel.classList.add('minimized');
        toggleBtn.textContent = '+';
        panelTitle.style.display = 'none';
      } else {
        uiPanel.classList.remove('minimized');
        toggleBtn.textContent = '-';
        panelTitle.style.display = 'block';
      }
    });

    const CFG = { maskScale: 3.0, mogoScale: 0.15, mogoOffsetX: 0, mogoOffsetY: 0, chpScale: 0.12, chpOffsetX: 0, chpOffsetY: 0 };

    function bindControl(rangeId, numId, objKey) {
      const r = document.getElementById(rangeId), n = document.getElementById(numId);
      if(!r || !n) return;
      r.addEventListener('input', (e) => { n.value = e.target.value; CFG[objKey] = parseFloat(e.target.value); });
      n.addEventListener('input', (e) => { r.value = e.target.value; CFG[objKey] = parseFloat(e.target.value) || 0; });
    }

    bindControl('maskScaleR', 'maskScaleN', 'maskScale');
    bindControl('mogoScaleR', 'mogoScaleN', 'mogoScale');
    bindControl('mogoXOffsetR', 'mogoXOffsetN', 'mogoOffsetX');
    bindControl('mogoYOffsetR', 'mogoYOffsetN', 'mogoOffsetY');
    bindControl('chpScaleR', 'chpScaleN', 'chpScale');
    bindControl('chpXOffsetR', 'chpXOffsetN', 'chpOffsetX');
    bindControl('chpYOffsetR', 'chpYOffsetN', 'chpOffsetY');

    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const startBtn = document.getElementById('start-btn');
    const bgMusic = document.getElementById('bg-music');

    const maskImg = new Image(); maskImg.src = 'green lantern mask2.png';
    const ringImg = new Image(); ringImg.src = 'landtern ring.png';
    const chpImg = new Image();  chpImg.src = "Ch'p-Photoroom.png";
    const mogoImg = new Image(); mogoImg.src = 'mogo.png';

    let faceResults = null, handResults = null;

    const faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    faceMesh.onResults((results) => { faceResults = results; });

    const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
    hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    hands.onResults((results) => { handResults = results; });

    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none';
      bgMusic.play().catch(e => console.log("Audio error:", e));

      const camera = new Camera(videoElement, {
        onFrame: async () => {
          await faceMesh.send({ image: videoElement });
          await hands.send({ image: videoElement });
        },
        width: 1280, height: 720
      });
      await camera.start();
      requestAnimationFrame(animateLoop);
    });

    function animateLoop() {
      drawScene();
      requestAnimationFrame(animateLoop);
    }

    function drawScene() {
      canvasElement.width = videoElement.videoWidth || 1280;
      canvasElement.height = videoElement.videoHeight || 720;
      const width = canvasElement.width, height = canvasElement.height;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, width, height);
      canvasCtx.drawImage(videoElement, 0, 0, width, height);

      const now = performance.now() * 0.0025;
      const floatRange = height * 0.025;
      const mogoFloatY = Math.sin(now) * floatRange;
      const chpFloatY = Math.cos(now) * floatRange;

      const mogoWidth = width * CFG.mogoScale;
      const mogoHeight = mogoWidth * (mogoImg.height / mogoImg.width || 1);
      canvasCtx.drawImage(mogoImg, (width * 0.06) + CFG.mogoOffsetX, (height * 0.1) + mogoFloatY + CFG.mogoOffsetY, mogoWidth, mogoHeight);

      const chpWidth = width * CFG.chpScale;
      const chpHeight = chpWidth * (chpImg.height / chpImg.width || 1);
      canvasCtx.drawImage(chpImg, (width * 0.82) + CFG.chpOffsetX, (height * 0.08) + chpFloatY + CFG.chpOffsetY, chpWidth, chpHeight);

      if (faceResults && faceResults.multiFaceLandmarks && faceResults.multiFaceLandmarks.length > 0) {
        const landmarks = faceResults.multiFaceLandmarks[0];
        const leftEye = landmarks[33], rightEye = landmarks[263];
        const eyeX = ((leftEye.x + rightEye.x) / 2) * width, eyeY = ((leftEye.y + rightEye.y) / 2) * height;
        const deltaX = (rightEye.x - leftEye.x) * width, deltaY = (rightEye.y - leftEye.y) * height;
        const eyeDistance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
        const angle = Math.atan2(deltaY, deltaX);
        const maskWidth = eyeDistance * CFG.maskScale;
        const maskHeight = maskWidth * (maskImg.height / maskImg.width || 0.5);

        canvasCtx.save();
        canvasCtx.translate(eyeX, eyeY);
        canvasCtx.rotate(angle);
        canvasCtx.drawImage(maskImg, -maskWidth / 2, -maskHeight / 2, maskWidth, maskHeight);
        canvasCtx.restore();
      }

      if (handResults && handResults.multiHandLandmarks) {
        for (const landmarks of handResults.multiHandLandmarks) {
          const middleFingerBase = landmarks[10];
          const rx = middleFingerBase.x * width, ry = middleFingerBase.y * height;
          const wrist = landmarks[0], middleTip = landmarks[12];
          const handSize = Math.sqrt(Math.pow((middleTip.x - wrist.x) * width, 2) + Math.pow((middleTip.y - wrist.y) * height, 2));
          const ringSize = Math.max(35, handSize * 0.32);

          canvasCtx.save();
          canvasCtx.translate(rx, ry);
          canvasCtx.shadowColor = '#00ff66';
          canvasCtx.shadowBlur = 20;
          canvasCtx.drawImage(ringImg, -ringSize / 2, -ringSize / 2, ringSize, ringSize);
          canvasCtx.restore();
        }
      }
      canvasCtx.restore();
    }
  </script>
</body>
</html>
