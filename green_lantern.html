<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Lantern AR Experience</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    video {
      display: none;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }
    #start-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      padding: 20px 40px;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      background: #006600;
      border: 3px solid #00ff00;
      border-radius: 50px;
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.8);
      cursor: pointer;
      text-transform: uppercase;
    }
  </style>

  <!-- Three.js & MediaPipe -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.5org/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="container">
    <button id="start-btn">🟢 IN BRIGHTEST DAY... (START) 🟢</button>
    <video id="webcam" playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <audio id="bg-music" src="Hero.mp3" loop></audio>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const startBtn = document.getElementById('start-btn');
    const bgMusic = document.getElementById('bg-music');

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ canvas: canvasElement, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none';
      bgMusic.play().catch(e => console.log("Audio play error:", e));

      const cameraUtils = new Camera(videoElement, {
        onFrame: async () => {},
        width: 1280,
        height: 720
      });
      cameraUtils.start();
      animate();
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
