<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wild West Cowboy AR</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #start-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      padding: 20px 40px;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      background: #8b4513;
      border: 3px solid #ffd700;
      border-radius: 50px;
      box-shadow: 0 0 30px rgba(139, 69, 19, 0.9);
      cursor: pointer;
      text-transform: uppercase;
    }
  </style>

  <!-- Three.js & GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="container">
    <button id="start-btn">🤠 DRAW YOUR GUN! (START) 🤠</button>
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <audio id="bg-music" src="Franco Micalizzi - Trinity titoli.mp3" loop></audio>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const startBtn = document.getElementById('start-btn');
    const bgMusic = document.getElementById('bg-music');

    // 1. Three.js Scene
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ canvas: canvasElement, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(0, 10, 10);
    scene.add(dirLight);

    // 2. Load Models
    const loader = new THREE.GLTFLoader();
    let hatModel = null;
    let gunModel = null;

    loader.load('cowboy_hat2.glb', (gltf) => {
      hatModel = gltf.scene;
      hatModel.visible = false;
      scene.add(hatModel);
    });

    loader.load('colt_revlover.glb', (gltf) => {
      gunModel = gltf.scene;
      gunModel.visible = false;
      scene.add(gunModel);
    });

    // 3. Trackers
    let faceLandmarksData = null;
    let handLandmarksData = null;

    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true });
    faceMesh.onResults(results => {
      faceLandmarksData = (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) ? results.multiFaceLandmarks[0] : null;
    });

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    hands.onResults(results => {
      handLandmarksData = (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) ? results.multiHandLandmarks[0] : null;
    });

    // 4. Start Button
    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none';
      bgMusic.play().catch(e => console.log("Audio play error:", e));

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: false });
        videoElement.srcObject = stream;
        await videoElement.play();

        const sendToMediaPipe = async () => {
          if (!videoElement.paused && !videoElement.ended) {
            await faceMesh.send({ image: videoElement });
            await hands.send({ image: videoElement });
          }
          requestAnimationFrame(sendToMediaPipe);
        };
        sendToMediaPipe();

        animate();
      } catch (err) {
        console.error("Camera access error:", err);
      }
    });

    // แปลงพิกัด 2D MediaPipe เป็น 3D World Space
    function get3DPos(point) {
      const x = (1 - point.x) * 2 - 1; // สลับแกนเพราะเป็นกระจก
      const y = -(point.y * 2 - 1);
      const z = point.z || 0;

      const vector = new THREE.Vector3(x, y, 0.5);
      vector.unproject(camera);
      const dir = vector.sub(camera.position).normalize();
      const distance = -camera.position.z / dir.z;
      const pos = camera.position.clone().add(dir.multiplyScalar(distance));
      return { pos, rawX: x, rawY: y, rawZ: z };
    }

    // 5. Render Loop (คํานวณตำแหน่งครอบหัว และกำมือจับปืน)
    function animate() {
      requestAnimationFrame(animate);

      // --- หมวกคาวบอย (คำนวณสวมครอบหัวเป๊ะ) ---
      if (faceLandmarksData && hatModel) {
        hatModel.visible = true;

        const forehead = faceLandmarksData[10];   // หน้าผากบน
        const nose = faceLandmarksData[1];          // ดั้งจมูก
        const leftEye = faceLandmarksData[33];      // ตาซ้าย
        const rightEye = faceLandmarksData[263];    // ตาขวา

        const forehead3D = get3DPos(forehead);
        const leftEye3D = get3DPos(leftEye);
        const rightEye3D = get3DPos(rightEye);

        // 1. หาความกว้างของใบหน้าเพื่อย่อ-ขยายหมวกตามระยะใกล้-ไกล
        const eyeDistance = leftEye3D.pos.distanceTo(rightEye3D.pos);
        const scaleFactor = eyeDistance * 3.8; // ปรับตัวคูณสเกลหมวกให้พอดีหัว
        hatModel.scale.set(scaleFactor, scaleFactor, scaleFactor);

        // 2. วางตำแหน่งหมวกลงมาสวมหัว (กดต่ำลงมาจากหน้าผากเล็กน้อย)
        hatModel.position.set(forehead3D.pos.x, forehead3D.pos.y - (eyeDistance * 0.2), forehead3D.pos.z);

        // 3. หมุนหมวกตามการหมุนเอียงของศีรษะ
        const angleZ = Math.atan2(rightEye.y - leftEye.y, rightEye.x - leftEye.x);
        const angleY = Math.atan2(nose.x - forehead.x, nose.z - forehead.z);
        hatModel.rotation.z = -angleZ;
        hatModel.rotation.y = angleY * 0.5;

      } else if (hatModel) {
        hatModel.visible = false;
      }

      // --- ปืนลูกโม่ (คำนวณจับเข้าอุ้งมือ) ---
      if (handLandmarksData && gunModel) {
        gunModel.visible = true;

        const wrist = handLandmarksData[0];          // ข้อมือ
        const indexMCP = handLandmarksData[5];       // โคนนิ้วชี้
        const pinkyMCP = handLandmarksData[17];      // โคนนิ้วก้อย

        const wrist3D = get3DPos(wrist);
        const index3D = get3DPos(indexMCP);
        const pinky3D = get3DPos(pinkyMCP);

        // 1. หาขนาดอุ้งมือเพื่อสเกลปืน
        const handSize = index3D.pos.distanceTo(pinky3D.pos);
        const gunScale = handSize * 2.2;
        gunModel.scale.set(gunScale, gunScale, gunScale);

        // 2. วางด้ามปืนให้อยู่ตรงกลางอุ้งมือ
        gunModel.position.set(wrist3D.pos.x, wrist3D.pos.y, wrist3D.pos.z);

        // 3. ปรับองศาปืนให้ชี้ออกจากมือ
        const angleHand = Math.atan2(indexMCP.y - wrist.y, indexMCP.x - wrist.x);
        gunModel.rotation.z = -angleHand + Math.PI / 4;

      } else if (gunModel) {
        gunModel.visible = false;
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
