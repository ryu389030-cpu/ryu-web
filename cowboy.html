<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wild West Cowboy AR - Zero Position</title>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
    #container { position: relative; width: 100vw; height: 100vh; }
    video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #start-btn {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 30;
      padding: 20px 40px; font-size: 22px; font-weight: bold; color: #fff; background: #8b4513;
      border: 3px solid #ffd700; border-radius: 50px; cursor: pointer; text-transform: uppercase;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="container">
    <button id="start-btn">🤠 เทสต์พิกัด 0,0,0 (สเกลเดิม) 🤠</button>
    <video id="webcam" playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <audio id="bg-music" src="Franco Micalizzi - Trinity titoli.mp3" loop></audio>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const startBtn = document.getElementById('start-btn');
    const bgMusic = document.getElementById('bg-music');

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ canvas: canvasElement, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    scene.add(new THREE.AmbientLight(0xffffff, 1.5));

    let hatModel = null;
    let gunModel = null;
    const loader = new THREE.GLTFLoader();

    // ใช้สเกลตั้งต้นปกติของไฟล์โมเดลเลย
    loader.load('cowboy_hat2.glb', (gltf) => {
      hatModel = gltf.scene;
      scene.add(hatModel);
    });

    loader.load('colt_revlover.glb', (gltf) => {
      gunModel = gltf.scene;
      scene.add(gunModel);
    });

    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none';
      bgMusic.play().catch(e => console.log(e));

      const cameraUtils = new Camera(videoElement, {
        onFrame: async () => {},
        width: 1280, height: 720
      });
      cameraUtils.start();
      animate();
    });

    function animate() {
      requestAnimationFrame(animate);

      // บังคับล็อก Position เป็น 0,0,0 ตรงกลางจอแบบเป๊ะๆ
      if (hatModel) hatModel.position.set(0, 0, 0);
      if (gunModel) gunModel.position.set(0, 0, 0);

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
