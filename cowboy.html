<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wild West Cowboy AR - Real-time Tuner</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #start-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      padding: 20px 40px;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      background: #8b4513;
      border: 3px solid #ffd700;
      border-radius: 50px;
      box-shadow: 0 0 30px rgba(139, 69, 19, 0.9);
      cursor: pointer;
      text-transform: uppercase;
    }

    /* 🎛️ กล่อง UI สำหรับปรับแต่ง Real-time */
    #ui-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 50;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #ffd700;
      font-size: 12px;
      max-width: 280px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    #ui-panel h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #ffd700;
      text-align: center;
    }
    .control-group {
      margin-bottom: 10px;
      border-bottom: 1px solid #444;
      padding-bottom: 8px;
    }
    .control-group h4 {
      margin: 4px 0;
      color: #00ffcc;
      font-size: 13px;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 0;
    }
    .control-row label {
      width: 65px;
    }
    .control-row input[type="range"] {
      flex: 1;
      margin: 0 8px;
    }
    .control-row input[type="number"] {
      width: 50px;
      background: #222;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
      text-align: center;
      font-size: 12px;
    }
  </style>

  <!-- Three.js & GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="container">
    <button id="start-btn">🤠 START COWBOY AR 🤠</button>

    <!-- 🎛️ แผงควบคุม UI ปรับค่า real-time -->
    <div id="ui-panel">
      <h3>🤠 AR Real-Time Tuner</h3>
      
      <!-- ปรับหมวก -->
      <div class="control-group">
        <h4>🎩 หมวก (Hat Config)</h4>
        
        <div class="control-row">
          <label>Scale:</label>
          <input type="range" id="hatScaleRange" min="0.01" max="5.0" step="0.01" value="0.5">
          <input type="number" id="hatScaleNum" step="0.01" value="0.5">
        </div>

        <div class="control-row">
          <label>Offset X:</label>
          <input type="range" id="hatXRange" min="-3.0" max="3.0" step="0.05" value="0.0">
          <input type="number" id="hatXNum" step="0.05" value="0.0">
        </div>

        <div class="control-row">
          <label>Offset Y:</label>
          <input type="range" id="hatYRange" min="-3.0" max="3.0" step="0.05" value="0.35">
          <input type="number" id="hatYNum" step="0.05" value="0.35">
        </div>

        <div class="control-row">
          <label>Offset Z:</label>
          <input type="range" id="hatZRange" min="-3.0" max="3.0" step="0.05" value="0.0">
          <input type="number" id="hatZNum" step="0.05" value="0.0">
        </div>
      </div>

      <!-- ปรับปืน -->
      <div class="control-group">
        <h4>🔫 ปืน (Gun Config)</h4>

        <div class="control-row">
          <label>Scale:</label>
          <input type="range" id="gunScaleRange" min="0.01" max="5.0" step="0.01" value="0.4">
          <input type="number" id="gunScaleNum" step="0.01" value="0.4">
        </div>

        <div class="control-row">
          <label>Offset X:</label>
          <input type="range" id="gunXRange" min="-3.0" max="3.0" step="0.05" value="0.0">
          <input type="number" id="gunXNum" step="0.05" value="0.0">
        </div>

        <div class="control-row">
          <label>Offset Y:</label>
          <input type="range" id="gunYRange" min="-3.0" max="3.0" step="0.05" value="0.0">
          <input type="number" id="gunYNum" step="0.05" value="0.0">
        </div>

        <div class="control-row">
          <label>Offset Z:</label>
          <input type="range" id="gunZRange" min="-3.0" max="3.0" step="0.05" value="0.0">
          <input type="number" id="gunZNum" step="0.05" value="0.0">
        </div>
      </div>
    </div>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <audio id="bg-music" src="Franco Micalizzi - Trinity titoli.mp3" loop></audio>

  <script>
    // ตัวแปรเก็บค่าคอนฟิก
    const HAT_CONFIG = { scale: 0.5, offsetX: 0.0, offsetY: 0.35, offsetZ: 0.0 };
    const GUN_CONFIG = { scale: 0.4, offsetX: 0.0, offsetY: 0.0, offsetZ: 0.0 };

    // ผูก Event Listeners กับ UI ให้เปลี่ยนค่าแบบ Real-time ทันที
    function bindInputSync(rangeId, numId, configObj, key) {
      const rangeEl = document.getElementById(rangeId);
      const numEl = document.getElementById(numId);

      rangeEl.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        numEl.value = val;
        configObj[key] = val;
      });

      numEl.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value) || 0;
        rangeEl.value = val;
        configObj[key] = val;
      });
    }

    // ผูกค่า UI กับตัวแปรคอนฟิก
    bindInputSync('hatScaleRange', 'hatScaleNum', HAT_CONFIG, 'scale');
    bindInputSync('hatXRange', 'hatXNum', HAT_CONFIG, 'offsetX');
    bindInputSync('hatYRange', 'hatYNum', HAT_CONFIG, 'offsetY');
    bindInputSync('hatZRange', 'hatZNum', HAT_CONFIG, 'offsetZ');

    bindInputSync('gunScaleRange', 'gunScaleNum', GUN_CONFIG, 'scale');
    bindInputSync('gunXRange', 'gunXNum', GUN_CONFIG, 'offsetX');
    bindInputSync('gunYRange', 'gunYNum', GUN_CONFIG, 'offsetY');
    bindInputSync('gunZRange', 'gunZNum', GUN_CONFIG, 'offsetZ');

    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const startBtn = document.getElementById('start-btn');
    const bgMusic = document.getElementById('bg-music');

    // 1. Three.js Scene Setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ canvas: canvasElement, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(0, 10, 10);
    scene.add(dirLight);

    // 2. Load Models
    const loader = new THREE.GLTFLoader();
    let hatModel = null;
    let gunModel = null;

    loader.load('cowboy_hat2.glb', (gltf) => {
      hatModel = gltf.scene;
      hatModel.visible = false;
      scene.add(hatModel);
    });

    loader.load('colt_revlover.glb', (gltf) => {
      gunModel = gltf.scene;
      gunModel.visible = false;
      scene.add(gunModel);
    });

    // 3. Trackers
    let faceLandmarksData = null;
    let handLandmarksData = null;

    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true });
    faceMesh.onResults(results => {
      faceLandmarksData = (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) ? results.multiFaceLandmarks[0] : null;
    });

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    hands.onResults(results => {
      handLandmarksData = (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) ? results.multiHandLandmarks[0] : null;
    });

    // 4. Start Button
    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none';
      bgMusic.play().catch(e => console.log("Audio play error:", e));

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: false });
        videoElement.srcObject = stream;
        await videoElement.play();

        const sendToMediaPipe = async () => {
          if (!videoElement.paused && !videoElement.ended) {
            await faceMesh.send({ image: videoElement });
            await hands.send({ image: videoElement });
          }
          requestAnimationFrame(sendToMediaPipe);
        };
        sendToMediaPipe();

        animate();
      } catch (err) {
        console.error("Camera error:", err);
      }
    });

    function getScreenToWorld(x, y) {
      const vector = new THREE.Vector3((1 - x) * 2 - 1, -(y * 2 - 1), 0.5);
      vector.unproject(camera);
      const dir = vector.sub(camera.position).normalize();
      const distance = -camera.position.z / dir.z;
      return camera.position.clone().add(dir.multiplyScalar(distance));
    }

    // 5. Render Loop
    function animate() {
      requestAnimationFrame(animate);

      // --- หมวกคาวบอย ---
      if (faceLandmarksData && hatModel) {
        hatModel.visible = true;
        
        // อัปเดตสเกลแบบ Real-time
        hatModel.scale.set(HAT_CONFIG.scale, HAT_CONFIG.scale, HAT_CONFIG.scale);

        const forehead = faceLandmarksData[10];
        const leftEye = faceLandmarksData[33];
        const rightEye = faceLandmarksData[263];

        const pos = getScreenToWorld(forehead.x, forehead.y);
        
        // อัปเดตตำแหน่งแบบ Real-time
        hatModel.position.set(
          pos.x + HAT_CONFIG.offsetX, 
          pos.y + HAT_CONFIG.offsetY, 
          pos.z + HAT_CONFIG.offsetZ
        );

        const angle = Math.atan2(rightEye.y - leftEye.y, rightEye.x - leftEye.x);
        hatModel.rotation.z = -angle;
      } else if (hatModel) {
        hatModel.visible = false;
      }

      // --- ปืนลูกโม่ ---
      if (handLandmarksData && gunModel) {
        gunModel.visible = true;

        // อัปเดตสเกลแบบ Real-time
        gunModel.scale.set(GUN_CONFIG.scale, GUN_CONFIG.scale, GUN_CONFIG.scale);

        const wrist = handLandmarksData[0];
        const indexMCP = handLandmarksData[5];

        const pos = getScreenToWorld(wrist.x, wrist.y);

        // อัปเดตตำแหน่งแบบ Real-time
        gunModel.position.set(
          pos.x + GUN_CONFIG.offsetX, 
          pos.y + GUN_CONFIG.offsetY, 
          pos.z + GUN_CONFIG.offsetZ
        );

        const angleHand = Math.atan2(indexMCP.y - wrist.y, indexMCP.x - wrist.x);
        gunModel.rotation.z = -angleHand + Math.PI / 4;
      } else if (gunModel) {
        gunModel.visible = false;
      }
