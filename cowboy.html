<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wild West Cowboy AR - Realtime Tuner</title>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }
    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* 🎛️ ปุ่ม Start ใหญ่ชัดเจน */
    #start-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 99999;
      padding: 20px 40px;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      background: #8b4513;
      border: 3px solid #ffd700;
      border-radius: 50px;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
      cursor: pointer;
      text-transform: uppercase;
    }

    /* 🎛️ กล่อง UI ปรับแต่ง ลอยอยู่มุมซ้ายบน */
    #ui-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 99999;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid #ffd700;
      font-size: 12px;
      width: 280px;
      max-height: 90vh;
      overflow-y: auto;
      display: block; /* แสดง UI ค้างไว้ตลอดเลย */
    }
    #ui-panel h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #ffd700;
      text-align: center;
    }
    .control-group {
      margin-bottom: 8px;
      border-bottom: 1px solid #444;
      padding-bottom: 6px;
    }
    .control-group h4 {
      margin: 2px 0;
      color: #00ffcc;
      font-size: 12px;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 3px 0;
    }
    .control-row label {
      width: 65px;
    }
    .control-row input[type="range"] {
      flex: 1;
      margin: 0 6px;
    }
    .control-row input[type="number"] {
      width: 50px;
      background: #222;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
      text-align: center;
    }

    /* กล่อง Error Log สำหรับดีบั๊กบนหน้าจอมือถือ */
    #log-panel {
      position: absolute;
      bottom: 5px;
      left: 5px;
      right: 5px;
      z-index: 99999;
      background: rgba(255, 0, 0, 0.8);
      color: white;
      font-size: 11px;
      font-family: monospace;
      padding: 5px;
      border-radius: 5px;
      display: none;
    }
  </style>

  <!-- Three.js & GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <!-- MediaPipe Trackers -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="app-container">
    <button id="start-btn">🤠 กดตรงนี้เพื่อเริ่ม AR 🤠</button>

    <!-- UI แผงปรับค่า REALTIME -->
    <div id="ui-panel">
      <h3>🤠 AR Tuner (ปรับสด)</h3>
      
      <!-- หมวก -->
      <div class="control-group">
        <h4>🎩 หมวก (Hat Config)</h4>
        <div class="control-row">
          <label>Scale:</label>
          <input type="range" id="hatScaleRange" min="0.01" max="2.0" step="0.01" value="0.15">
          <input type="number" id="hatScaleNum" step="0.01" value="0.15">
        </div>
        <div class="control-row">
          <label>Offset X:</label>
          <input type="range" id="hatXRange" min="-3.0" max="3.0" step="0.05" value="0.0">
          <input type="number" id="hatXNum" step="0.05" value="0.0">
        </div>
        <div class="control-row">
          <label>Offset Y:</label>
          <input type="range" id="hatYRange" min="-3.0" max="3.0" step="0.05" value="0.35">
          <input type="number" id="hatYNum" step="0.05" value="0.35">
        </div>
        <div class="control-row">
          <label>Offset Z:</label>
          <input type="range" id="hatZRange" min="-3.0" max="3.0" step="0.05" value="0.0">
          <input type="number" id="hatZNum" step="0.05" value="0.0">
        </div>
      </div>

      <!-- ปืน -->
      <div class="control-group">
        <h4>🔫 ปืน (Gun Config)</h4>
        <div class="control-row">
          <label>Scale:</label>
          <input type="range" id="gunScaleRange" min="0.01" max="2.0" step="0.01" value="0.1">
          <input type="number" id="gunScaleNum" step="0.01" value="0.1">
        </div>
        <div class="control-row">
          <label>Offset X:</label>
          <input type="range" id="gunXRange" min="-3.0" max="3.0" step="0.05" value="0.0">
          <input type="number" id="gunXNum" step="0.05" value="0.0">
        </div>
        <div class="control-row">
          <label>Offset Y:</label>
          <input type="range" id="gunYRange" min="-3.0" max="3.0" step="0.05" value="0.0">
          <input type="number" id="gunYNum" step="0.05" value="0.0">
        </div>
        <div class="control-row">
          <label>Offset Z:</label>
          <input type="range" id="gunZRange" min="-3.0" max="3.0" step="0.05" value="0.0">
          <input type="number" id="gunZNum" step="0.05" value="0.0">
        </div>
      </div>
    </div>

    <div id="log-panel"></div>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <audio id="bg-music" src="Franco Micalizzi - Trinity titoli.mp3" loop></audio>

  <script>
    // แสดง Error Log ถ้ามีอะไรพัง
    function showLog(msg) {
      const logBox = document.getElementById('log-panel');
      logBox.style.display = 'block';
      logBox.innerHTML += msg + '<br>';
    }

    window.onerror = function(msg, url, line) {
      showLog(`ERR: ${msg} (Line ${line})`);
    };

    const HAT_CONFIG = { scale: 0.15, offsetX: 0.0, offsetY: 0.35, offsetZ: 0.0 };
    const GUN_CONFIG = { scale: 0.1, offsetX: 0.0, offsetY: 0.0, offsetZ: 0.0 };

    function bindSync(rangeId, numId, obj, key) {
      const r = document.getElementById(rangeId);
      const n = document.getElementById(numId);
      if(!r || !n) return;
      r.addEventListener('input', (e) => { n.value = e.target.value; obj[key] = parseFloat(e.target.value); });
      n.addEventListener('input', (e) => { r.value = e.target.value; obj[key] = parseFloat(e.target.value) || 0; });
    }

    bindSync('hatScaleRange', 'hatScaleNum', HAT_CONFIG, 'scale');
    bindSync('hatXRange', 'hatXNum', HAT_CONFIG, 'offsetX');
    bindSync('hatYRange', 'hatYNum', HAT_CONFIG, 'offsetY');
    bindSync('hatZRange', 'hatZNum', HAT_CONFIG, 'offsetZ');

    bindSync('gunScaleRange', 'gunScaleNum', GUN_CONFIG, 'scale');
    bindSync('gunXRange', 'gunXNum', GUN_CONFIG, 'offsetX');
    bindSync('gunYRange', 'gunYNum', GUN_CONFIG, 'offsetY');
    bindSync('gunZRange', 'gunZNum', GUN_CONFIG, 'offsetZ');

    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const startBtn = document.getElementById('start-btn');
    const bgMusic = document.getElementById('bg-music');

    // Scene
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ canvas: canvasElement, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(0, 10, 10);
    scene.add(dirLight);

    // Loader
    const loader = new THREE.GLTFLoader();
    let hatModel = null;
    let gunModel = null;

    loader.load('cowboy_hat2.glb', (gltf) => {
      hatModel = gltf.scene;
      hatModel.visible = false;
      scene.add(hatModel);
    }, undefined, (e) => showLog('Load Hat Fail: ' + e.message));

    loader.load('colt_revlover.glb', (gltf) => {
      gunModel = gltf.scene;
      gunModel.visible = false;
      scene.add(gunModel);
    }, undefined, (e) => showLog('Load Gun Fail: ' + e.message));

    let faceLandmarksData = null;
    let handLandmarksData = null;

    // MediaPipe Setup
    try {
      const faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
      faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true });
      faceMesh.onResults(r => { faceLandmarksData = (r.multiFaceLandmarks && r.multiFaceLandmarks.length > 0) ? r.multiFaceLandmarks[0] : null; });

      const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
      hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
      hands.onResults(r => { handLandmarksData = (r.multiHandLandmarks && r.multiHandLandmarks.length > 0) ? r.multiHandLandmarks[0] : null; });

      startBtn.addEventListener('click', async () => {
        startBtn.style.display = 'none';
        bgMusic.play().catch(() => {});

        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: false });
          videoElement.srcObject = stream;
          await videoElement.play();

          const sendFrame = async () => {
            if (!videoElement.paused && !videoElement.ended) {
              await faceMesh.send({ image: videoElement });
              await hands.send({ image: videoElement });
            }
            requestAnimationFrame(sendFrame);
          };
          sendFrame();
          animate();
        } catch (err) {
          showLog('Cam Error: ' + err.message);
        }
      });
    } catch(e) {
      showLog('MediaPipe Init Fail: ' + e.message);
    }

    function getScreenToWorld(x, y) {
      const vector = new THREE.Vector3((1 - x) * 2 - 1, -(y * 2 - 1), 0.5);
      vector.unproject(camera);
      const dir = vector.sub(camera.position).normalize();
      const distance = -camera.position.z / dir.z;
      return camera.position.clone().add(dir.multiplyScalar(distance));
    }

    function animate() {
      requestAnimationFrame(animate);

      if (faceLandmarksData && hatModel) {
        hatModel.visible = true;
        hatModel.scale.set(HAT_CONFIG.scale, HAT_CONFIG.scale, HAT_CONFIG.scale);
        const forehead = faceLandmarksData[10];
        const leftEye = faceLandmarksData[33];
        const rightEye = faceLandmarksData[263];
        const pos = getScreenToWorld(forehead.x, forehead.y);
        hatModel.position.set(pos.x + HAT_CONFIG.offsetX, pos.y + HAT_CONFIG.offsetY, pos.z + HAT_CONFIG.offsetZ);
        const angle = Math.atan2(rightEye.y - leftEye.y, rightEye.x - leftEye.x);
        hatModel.rotation.z = -angle;
      } else if (hatModel) {
        hatModel.visible = false;
      }

      if (handLandmarksData && gunModel) {
        gunModel.visible = true;
        gunModel.scale.set(GUN_CONFIG.scale, GUN_CONFIG.scale, GUN_CONFIG.scale);
        const wrist = handLandmarksData[0];
        const indexMCP = handLandmarksData[5];
        const pos = getScreenToWorld(wrist.x, wrist.y);
        gunModel.position.set(pos.x + GUN_CONFIG.offsetX, pos.y + GUN_CONFIG.offsetY, pos.z + GUN_CONFIG.offsetZ);
        const angleHand = Math.atan2(indexMCP.y - wrist.y, indexMCP.x - wrist.x);
        gunModel.rotation.z = -angleHand + Math.PI / 4;
      } else if (gunModel) {
        gunModel.visible = false;
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
