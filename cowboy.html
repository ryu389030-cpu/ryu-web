<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wild West Cowboy AR</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    /* ให้วิดีโอกล้องแสดงผลอยู่ชั้นหลังสุด */
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* โหมดกระจกเงา */
    }
    /* Canvas 3D ลอยอยู่ชั้นหน้าแบบโปร่งแสง */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #start-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      padding: 20px 40px;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      background: #8b4513;
      border: 3px solid #ffd700;
      border-radius: 50px;
      box-shadow: 0 0 30px rgba(139, 69, 19, 0.9);
      cursor: pointer;
      text-transform: uppercase;
      transition: 0.3s;
    }
    #start-btn:hover {
      background: #a0522d;
      box-shadow: 0 0 40px #ffd700;
      transform: translate(-50%, -50%) scale(1.05);
    }
  </style>

  <!-- Three.js & GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="container">
    <button id="start-btn">🤠 DRAW YOUR GUN! (START) 🤠</button>
    <video id="webcam" playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <!-- ไฟล์เพลง Trinity -->
  <audio id="bg-music" src="Franco Micalizzi - Trinity titoli.mp3" loop></audio>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const startBtn = document.getElementById('start-btn');
    const bgMusic = document.getElementById('bg-music');

    // 1. Three.js Scene Setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ canvas: canvasElement, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    // Light
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(0, 10, 10);
    scene.add(dirLight);

    // 2. Load 3D Models
    const loader = new THREE.GLTFLoader();
    let hatModel = null;
    let gunModel = null;

    // Load Cowboy Hat 3D
    loader.load('cowboy_hat2.glb', (gltf) => {
      hatModel = gltf.scene;
      hatModel.scale.set(1.5, 1.5, 1.5);
      hatModel.visible = false;
      scene.add(hatModel);
    }, undefined, (err) => console.log('Hat model error:', err));

    // Load Revolver 3D
    loader.load('colt_revlover.glb', (gltf) => {
      gunModel = gltf.scene;
      gunModel.scale.set(0.8, 0.8, 0.8);
      gunModel.visible = false;
      scene.add(gunModel);
    }, undefined, (err) => console.log('Gun model error:', err));

    // 3. Trackers Setup
    let faceLandmarksData = null;
    let handLandmarksData = null;

    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true });
    faceMesh.onResults(results => {
      faceLandmarksData = (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) ? results.multiFaceLandmarks[0] : null;
    });

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    hands.onResults(results => {
      handLandmarksData = (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) ? results.multiHandLandmarks[0] : null;
    });

    // 4. Start Button Click Action
    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none';
      bgMusic.play().catch(e => console.log("Audio play error:", e));

      const cameraUtils = new Camera(videoElement, {
        onFrame: async () => {
          await faceMesh.send({ image: videoElement });
          await hands.send({ image: videoElement });
        },
        width: 1280,
        height: 720
      });
      cameraUtils.start();
      animate();
    });

    // Transform Screen Coordinates to 3D Space
    function toWorldCoords(x, y, zDepth = 0) {
      const vec = new THREE.Vector3((1 - x) * 2 - 1, -(y * 2 - 1), 0.5);
      vec.unproject(camera);
      const dir = vec.sub(camera.position).normalize();
      const distance = (zDepth - camera.position.z) / dir.z;
      return camera.position.clone().add(dir.multiplyScalar(distance));
    }

    // 5. Render Loop
    function animate() {
      requestAnimationFrame(animate);

      // --- 1. หมวกคาวบอย 3D บนศีรษะ ---
      if (faceLandmarksData && hatModel) {
        hatModel.visible = true;
        const forehead = faceLandmarksData[10];
        const pos = toWorldCoords(forehead.x, forehead.y, 0);
        
        hatModel.position.set(pos.x, pos.y + 0.35, pos.z);

        const leftEye = faceLandmarksData[33];
        const rightEye = faceLandmarksData[263];
        const angle = Math.atan2(rightEye.y - leftEye.y, rightEye.x - leftEye.x);
        hatModel.rotation.z = -angle;
      } else if (hatModel) {
        hatModel.visible = false;
      }

      // --- 2. ปืนลูกโม่ Colt 3D บนมือ ---
      if (handLandmarksData && gunModel) {
        gunModel.visible = true;
        const indexFinger = handLandmarksData[8]; 
        const wrist = handLandmarksData[0];       
        const pos = toWorldCoords(wrist.x, wrist.y, 0);

        gunModel.position.set(pos.x, pos.y, pos.z);

        const angleHand = Math.atan2(indexFinger.y - wrist.y, indexFinger.x - wrist.x);
        gunModel.rotation.z = -angleHand;
      } else if (gunModel) {
        gunModel.visible = false;
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
