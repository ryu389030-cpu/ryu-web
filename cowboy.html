<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wild West Cowboy AR - Fixed Click</title>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #000; font-family: sans-serif;
    }
    #app-container { position: relative; width: 100vw; height: 100vh; }
    video {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1); z-index: 1;
    }
    canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 2;
    }
    
    /* 🤠 ปรับปุ่มให้ z-index สูงสุด ไม่มีทางโดนบังแน่นอน */
    #start-btn {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 2147483647; padding: 20px 40px; font-size: 22px; font-weight: bold;
      color: #fff; background: #8b4513; border: 3px solid #ffd700; border-radius: 50px;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.8); cursor: pointer; text-transform: uppercase;
    }

    /* แผง UI ปรับค่า real-time */
    #ui-panel {
      position: absolute; top: 10px; left: 10px; z-index: 99;
      background: rgba(0, 0, 0, 0.9); color: #fff; padding: 12px;
      border-radius: 10px; border: 2px solid #ffd700; font-size: 11px;
      width: 300px; max-height: 90vh; overflow-y: auto;
    }
    #ui-panel h3 { margin: 0 0 8px 0; font-size: 13px; color: #ffd700; text-align: center; }
    .control-group { margin-bottom: 8px; border-bottom: 1px solid #444; padding-bottom: 6px; }
    .control-group h4 { margin: 2px 0; color: #00ffcc; font-size: 11px; }
    .control-row { display: flex; align-items: center; justify-content: space-between; margin: 2px 0; }
    .control-row label { width: 65px; }
    .control-row input[type="range"] { flex: 1; margin: 0 4px; }
    .control-row input[type="number"] { width: 50px; background: #222; color: #fff; border: 1px solid #555; border-radius: 4px; text-align: center; font-size: 10px; }
    
    /* กล่องแสดง Error บนจอถ้าเกิดปัญหา */
    #log-panel {
      position: absolute; bottom: 10px; left: 10px; right: 10px; z-index: 2147483646;
      background: rgba(255, 0, 0, 0.9); color: white; font-size: 12px; font-family: monospace; padding: 10px; border-radius: 5px; display: none;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="app-container">
    <button id="start-btn">🤠 เริ่มระบบ AR (กดตรงนี้) 🤠</button>

    <div id="ui-panel">
      <h3>🤠 AR 3D Tuner</h3>
      
      <div class="control-group">
        <h4>🎩 หมวก (Hat Config)</h4>
        <div class="control-row"><label>Scale:</label><input type="range" id="hatScaleR" min="0.001" max="0.5" step="0.005" value="0.02"><input type="number" id="hatScaleN" step="0.005" value="0.02"></div>
        <div class="control-row"><label>Pos X:</label><input type="range" id="hatXR" min="-3.0" max="3.0" step="0.05" value="0.0"><input type="number" id="hatXN" step="0.05" value="0.0"></div>
        <div class="control-row"><label>Pos Y:</label><input type="range" id="hatYR" min="-3.0" max="3.0" step="0.05" value="0.3"><input type="number" id="hatYN" step="0.05" value="0.3"></div>
        <div class="control-row"><label>Pos Z:</label><input type="range" id="hatZR" min="-5.0" max="5.0" step="0.1" value="0.0"><input type="number" id="hatZN" step="0.1" value="0.0"></div>
        <div class="control-row"><label>Rot X:</label><input type="range" id="hatRotXR" min="-3.14" max="3.14" step="0.05" value="0"><input type="number" id="hatRotXN" step="0.05" value="0"></div>
        <div class="control-row"><label>Rot Y:</label><input type="range" id="hatRotYR" min="-3.14" max="3.14" step="0.05" value="0"><input type="number" id="hatRotYN" step="0.05" value="0"></div>
        <div class="control-row"><label>Rot Z:</label><input type="range" id="hatRotZR" min="-3.14" max="3.14" step="0.05" value="0"><input type="number" id="hatRotZN" step="0.05" value="0"></div>
      </div>

      <div class="control-group">
        <h4>🔫 ปืน (Gun Config)</h4>
        <div class="control-row"><label>Scale:</label><input type="range" id="gunScaleR" min="0.001" max="0.2" step="0.002" value="0.01"><input type="number" id="gunScaleN" step="0.002" value="0.01"></div>
        <div class="control-row"><label>Pos X:</label><input type="range" id="gunXR" min="-3.0" max="3.0" step="0.05" value="0.0"><input type="number" id="gunXN" step="0.05" value="0.0"></div>
        <div class="control-row"><label>Pos Y:</label><input type="range" id="gunYR" min="-3.0" max="3.0" step="0.05" value="0.0"><input type="number" id="gunYN" step="0.05" value="0.0"></div>
        <div class="control-row"><label>Pos Z:</label><input type="range" id="gunZR" min="-5.0" max="5.0" step="0.1" value="0.0"><input type="number" id="gunZN" step="0.1" value="0.0"></div>
        <div class="control-row"><label>Rot X:</label><input type="range" id="gunRotXR" min="-3.14" max="3.14" step="0.05" value="0"><input type="number" id="gunRotXN" step="0.05" value="0"></div>
        <div class="control-row"><label>Rot Y:</label><input type="range" id="gunRotYR" min="-3.14" max="3.14" step="0.05" value="0"><input type="number" id="gunRotYN" step="0.05" value="0"></div>
        <div class="control-row"><label>Rot Z:</label><input type="range" id="gunRotZR" min="-3.14" max="3.14" step="0.05" value="0"><input type="number" id="gunRotZN" step="0.05" value="0"></div>
      </div>
    </div>

    <div id="log-panel"></div>
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <audio id="bg-music" src="Franco Micalizzi - Trinity titoli.mp3" loop></audio>

  <script>
    function showLog(msg) {
      const box = document.getElementById('log-panel');
      box.style.display = 'block';
      box.innerHTML += msg + '<br>';
    }
    window.onerror = (m, u, l) => showLog(`ERR: ${m} (${l})`);

    const HAT_CONFIG = { scale: 0.02, offsetX: 0.0, offsetY: 0.3, offsetZ: 0.0, rotX: 0, rotY: 0, rotZ: 0 };
    const GUN_CONFIG = { scale: 0.01, offsetX: 0.0, offsetY: 0.0, offsetZ: 0.0, rotX: 0, rotY: 0, rotZ: 0 };

    function bindSync(rId, nId, obj, key) {
      const r = document.getElementById(rId), n = document.getElementById(nId);
      if(!r || !n) return;
      r.addEventListener('input', e => { n.value = e.target.value; obj[key] = parseFloat(e.target.value); });
      n.addEventListener('input', e => { r.value = e.target.value; obj[key] = parseFloat(e.target.value) || 0; });
    }

    bindSync('hatScaleR', 'hatScaleN', HAT_CONFIG, 'scale');
    bindSync('hatXR', 'hatXN', HAT_CONFIG, 'offsetX');
    bindSync('hatYR', 'hatYN', HAT_CONFIG, 'offsetY');
    bindSync('hatZR', 'hatZN', HAT_CONFIG, 'offsetZ');
    bindSync('hatRotXR', 'hatRotXN', HAT_CONFIG, 'rotX');
    bindSync('hatRotYR', 'hatRotYN', HAT_CONFIG, 'rotY');
    bindSync('hatRotZR', 'hatRotZN', HAT_CONFIG, 'rotZ');

    bindSync('gunScaleR', 'gunScaleN', GUN_CONFIG, 'scale');
    bindSync('gunXR', 'gunXN', GUN_CONFIG, 'offsetX');
    bindSync('gunYR', 'gunYN', GUN_CONFIG, 'offsetY');
    bindSync('gunZR', 'gunZN', GUN_CONFIG, 'offsetZ');
    bindSync('gunRotXR', 'gunRotXN', GUN_CONFIG, 'rotX');
    bindSync('gunRotYR', 'gunRotYN', GUN_CONFIG, 'rotY');
    bindSync('gunRotZR', 'gunRotZN', GUN_CONFIG, 'rotZ');

    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const startBtn = document.getElementById('start-btn');
    const bgMusic = document.getElementById('bg-music');

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ canvas: canvasElement, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(0, 10, 10);
    scene.add(dirLight);

    const loader = new THREE.GLTFLoader();
    let hatModel = null, gunModel = null;

    loader.load('cowboy_hat2.glb', g => { hatModel = g.scene; hatModel.visible = false; scene.add(hatModel); }, undefined, e => showLog('Hat Load Err: ' + e.message));
    loader.load('colt_revlover.glb', g => { gunModel = g.scene; gunModel.visible = false; scene.add(gunModel); }, undefined, e => showLog('Gun Load Err: ' + e.message));

    let faceData = null, handData = null;

    const faceMesh = new FaceMesh({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true });
    faceMesh.onResults(r => { faceData = r.multiFaceLandmarks?.[0] || null; });

    const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    hands.onResults(r => { handData = r.multiHandLandmarks?.[0] || null; });

    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none';
      bgMusic.play().catch(e => showLog('Audio Err: ' + e.message));
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: false });
        videoElement.srcObject = stream;
        await videoElement.play();

        const send = async () => {
          if (!videoElement.paused && !videoElement.ended) {
            await faceMesh.send({ image: videoElement });
            await hands.send({ image: videoElement });
          }
          requestAnimationFrame(send);
        };
        send();
        animate();
      } catch (err) { showLog('Cam Err: ' + err.message); }
    });

    function getScreenToWorld(x, y) {
      const vec = new THREE.Vector3((1 - x) * 2 - 1, -(y * 2 - 1), 0.5);
      vec.unproject(camera);
      const dir = vec.sub(camera.position).normalize();
      return camera.position.clone().add(dir.multiplyScalar(-camera.position.z / dir.z));
    }

    function animate() {
      requestAnimationFrame(animate);

      if (faceData && hatModel) {
        hatModel.visible = true;
        hatModel.scale.set(HAT_CONFIG.scale, HAT_CONFIG.scale, HAT_CONFIG.scale);
        const p = getScreenToWorld(faceData[10].x, faceData[10].y);
        hatModel.position.set(p.x + HAT_CONFIG.offsetX, p.y + HAT_CONFIG.offsetY, p.z + HAT_CONFIG.offsetZ);
        const baseRotZ = -Math.atan2(faceData[263].y - faceData[33].y, faceData[263].x - faceData[33].x);
        hatModel.rotation.set(HAT_CONFIG.rotX, HAT_CONFIG.rotY, baseRotZ + HAT_CONFIG.rotZ);
      } else if (hatModel) { hatModel.visible = false; }

      if (handData && gunModel) {
        gunModel.visible = true;
        gunModel.scale.set(GUN_CONFIG.scale, GUN_CONFIG.scale, GUN_CONFIG.scale);
        const p = getScreenToWorld(handData[0].x, handData[0].y);
        gunModel.position.set(p.x + GUN_CONFIG.offsetX, p.y + GUN_CONFIG.offsetY, p.z + GUN_CONFIG.offsetZ);
        const baseRotZ = -Math.atan2(handData[5].y - handData[0].y, handData[5].x - handData[0].x) + Math.PI / 4;
        gunModel.rotation.set(GUN_CONFIG.rotX, GUN_CONFIG.rotY, baseRotZ + GUN_CONFIG.rotZ);
      } else if (gunModel) { gunModel.visible = false; }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
